; /etc/supervisor/conf.d/trcustoms-staging-mailpit.conf on the server: the
; mail catcher of staging, which QA reads at mailhog.trcustoms.org. Staging
; sends to it with EMAIL_HOST=127.0.0.1 and EMAIL_PORT=1025.
[program:trcustoms-staging-mailpit]
command=/usr/local/bin/mailpit --database /srv/trcustoms-staging/data/mailpit.db --max 2000 --smtp 127.0.0.1:1025 --listen unix:/srv/trcustoms-staging/run/mailpit.sock:0660
directory=/srv/trcustoms-staging
user=svc-trcustoms-staging
autostart=true
autorestart=true
stdout_logfile=/var/log/trcustoms-staging/mailpit.log
redirect_stderr=true
